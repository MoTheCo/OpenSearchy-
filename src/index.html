<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSearchy</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1><span class="brand-mark" aria-hidden="true">O</span><span>Open<span class="brand-accent">Searchy</span></span></h1>
      <button id="settings-btn" class="icon-btn" title="Einstellungen" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.42 2.46a1.7 1.7 0 0 0-1.9-.78 1.7 1.7 0 0 0-1.03 1.6h-2.9a1.7 1.7 0 0 0-1.03-1.6 1.7 1.7 0 0 0-1.9.78l-1.42-2.46.06-.06A1.7 1.7 0 0 0 8.6 15a1.7 1.7 0 0 0-1.47-.85H7V11.3h.13A1.7 1.7 0 0 0 8.6 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06L9.62 5.6a1.7 1.7 0 0 0 1.9.78 1.7 1.7 0 0 0 1.03-1.6h2.9a1.7 1.7 0 0 0 1.03 1.6 1.7 1.7 0 0 0 1.9-.78l1.42 2.46-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.47 1.3H21v2.85h-.13A1.7 1.7 0 0 0 19.4 15Z"/></svg>
      </button>
    </header>
    <div class="main-content">
      <section class="search-panel">
        <form role="search" action="/" method="get" id="search-form">
          <svg class="search-leading-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          <input type="search" name="q" placeholder="Alles durchsuchen …" autocomplete="off" required>
          <button type="submit" aria-label="Suche starten"><span>Suchen</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 8 8-8 8"/></svg></button>
        </form>
        <nav class="tabs" aria-label="Ansicht">
          <button type="button" class="tab-btn active" data-view="search" aria-pressed="true">Internet</button>
          <button type="button" class="tab-btn" data-view="chat" aria-pressed="false">Chat</button>
          <button type="button" class="tab-btn" data-view="images" aria-pressed="false">Bilder</button>
          <button type="button" class="tab-btn" data-view="map" aria-pressed="false">Karte</button>
        </nav>
        <div id="view-search">
          <p id="status"></p>
          <ol id="results"></ol>
        </div>
      </section>
      <div class="chat-workspace" id="chat-workspace" hidden>
        <aside class="chat-history" id="chat-history" aria-label="Vergangene Chats">
          <div class="chat-history-header">
            <h2>Chats</h2>
            <button id="close-history-btn" class="icon-btn" title="Chat-Verlauf schließen" aria-label="Chat-Verlauf schließen">×</button>
          </div>
          <div class="chat-history-list" id="chat-history-list"></div>
        </aside>
        <aside class="chat-panel" id="chat-panel">
          <div class="chat-header">
            <h2 id="chat-title">Chat</h2>
            <div class="chat-controls">
              <button id="open-history-btn" class="icon-btn" title="Chat-Verlauf öffnen" aria-label="Chat-Verlauf öffnen">≡</button>
              <button id="new-chat-btn" class="icon-btn" title="Neuer Chat" aria-label="Neuer Chat">＋</button>
            </div>
          </div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-chips" id="chat-chips" hidden></div>
          <form class="chat-input-form" id="chat-form">
            <textarea id="chat-input" placeholder="Frage stellen … (@ für Modell oder Agent)" rows="1" aria-label="Nachricht"></textarea>
            <button type="submit" id="chat-submit" disabled>Senden</button>
          </form>
        </aside>
      </div>
      <section class="images-panel" id="images-panel" hidden>
        <p class="images-status" id="images-status"></p>
        <div class="image-results" id="image-results"></div>
      </section>
      <section class="map-panel" id="map-panel" hidden>
        <p class="map-status" id="map-status"></p>
        <div class="map-layout">
          <div class="map-canvas" id="map-canvas" aria-label="OpenStreetMap-Karte"></div>
          <ol class="map-results" id="map-results"></ol>
        </div>
        <p class="map-attribution">Kartenmaterial © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap-Mitwirkende</a></p>
      </section>
      <span id="sources-count" hidden></span>
      <aside class="sources-panel" id="sources-panel" hidden></aside>
    </div>
  </div>
  <div class="modal" id="settings-modal" hidden>
    <div class="modal-content">
      <h2>Einstellungen</h2>
      <div class="tabs">
        <button class="tab-btn active" data-tab="agents">Agenten</button>
        <button class="tab-btn" data-tab="providers">Provider</button>
        <button class="tab-btn" data-tab="prompts">Prompts</button>
        <button class="tab-btn" data-tab="security">Sicherheit</button>
      </div>
      <div class="tab-panels">
        <div class="tab-panel" id="tab-agents"></div>
        <div class="tab-panel" id="tab-providers" hidden></div>
        <div class="tab-panel" id="tab-prompts" hidden></div>
        <div class="tab-panel" id="tab-security" hidden></div>
      </div>
      <button class="modal-close" id="settings-close">Schließen</button>
    </div>
  </div>
  <div class="modal" id="agent-modal" hidden>
    <div class="modal-content">
      <h2 id="agent-modal-title">Agent erstellen</h2>
      <form id="agent-form">
        <input type="hidden" id="agent-id">
        <div class="form-group">
          <label for="agent-name">Name</label>
          <input type="text" id="agent-name" required>
        </div>
        <div class="form-group">
          <label for="agent-provider">Provider</label>
          <select id="agent-provider" required></select>
        </div>
        <div class="form-group">
          <label for="agent-model">Modell</label>
          <select id="agent-model" required></select>
          <input type="text" id="agent-model-custom" placeholder="Modell-ID des Anbieters" hidden>
        </div>
        <div class="form-group">
          <label for="agent-base-url">Base URL (optional)</label>
          <input type="url" id="agent-base-url" placeholder="https://api.openai.com/v1">
        </div>
        <div class="form-group">
          <label for="agent-prompt-template">Prompt-Vorlage</label>
          <select id="agent-prompt-template"></select>
        </div>
        <div class="form-group">
          <label for="agent-system-prompt">System Prompt</label>
          <textarea id="agent-system-prompt" rows="6" placeholder="Du bist ein hilfreicher Assistent..."></textarea>
        </div>
        <div class="form-group">
          <label for="agent-temperature">Temperature</label>
          <input type="range" id="agent-temperature" min="0" max="2" step="0.1" value="0.7">
          <span id="temperature-value">0.7</span>
        </div>
        <div class="form-group">
          <label for="agent-max-tokens">Max Tokens</label>
          <input type="number" id="agent-max-tokens" value="4000" min="100" max="128000">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="agent-cancel">Abbrechen</button>
          <button type="submit" class="btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>
  <div class="modal" id="confirm-modal" hidden>
    <div class="modal-content small">
      <p id="confirm-message"></p>
      <div class="form-actions">
        <button type="button" class="btn-secondary" id="confirm-cancel">Abbrechen</button>
        <button type="button" class="btn-danger" id="confirm-ok">Löschen</button>
      </div>
    </div>
  </div>
  <div class="modal" id="master-key-modal" hidden>
    <div class="modal-content small">
      <h2 id="master-title">Master-Passwort</h2>
      <p id="master-text"></p>
      <form id="master-key-form">
        <div class="form-group">
          <label for="master-password">Passwort</label>
          <input type="password" id="master-password" required autocomplete="current-password" minlength="1">
        </div>
        <div class="form-group" id="master-confirm-field" hidden>
          <label for="master-password-confirm">Passwort wiederholen</label>
          <input type="password" id="master-password-confirm" autocomplete="new-password">
        </div>
        <p class="form-error" id="master-error" hidden></p>
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="master-cancel">Abbrechen</button>
          <button type="submit" class="btn-primary" id="master-submit">Entsperren</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
